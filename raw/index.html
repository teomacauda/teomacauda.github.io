    <style>
        /* --- STILI INTRO / APERTURE SPLASH SCREEN --- */
        .splash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .shader-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 0% 0%, #ff7a00, transparent 80%), 
                radial-gradient(circle at 100% 0%, #000000, transparent 80%), 
                radial-gradient(circle at 100% 100%, #000000, transparent 80%), 
                radial-gradient(circle at 0% 100%, #ff7a00, transparent 80%);
        }

        .camera-lens {
            position: relative;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: #111;
            box-shadow: 
                0 0 0 10px #1a1a1a, 
                0 15px 50px rgba(0, 0, 0, 0.9),
                inset 0 0 20px rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 2;
        }

        .app-logo {
            position: absolute;
            width: 98px;
            height: 70px;
            opacity: 0;
            transform: scale(0.7);
            animation: revealLogo 0.8s forwards 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1;
        }

        .aperture-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            animation: spinAperture 1.4s forwards cubic-bezier(0.25, 1, 0.5, 1);
        }

        .blade {
            fill: #161616;
            stroke: #0a0a0a;
            stroke-width: 0.6;
            transform-origin: 50px 50px;
            animation: openAperture 1.2s forwards cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Keyframes Splash */
        @keyframes openAperture {
            0% { transform: scale(1) translate(0px, 0px); }
            20% { transform: scale(1.02) translate(0px, 0px); }
            100% { transform: scale(1) translate(35px, -15px) rotate(10deg); }
        }

        @keyframes spinAperture {
            0% { transform: rotate(-10deg); }
            100% { transform: rotate(50deg); }
        }

        @keyframes revealLogo {
            to { opacity: 1; transform: scale(1); }
        }

        .splash-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* --- STAGGERED REVEAL INTERFACCIA HUB --- */
        @keyframes uiReveal {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .ui-element {
            opacity: 0;
            animation: uiReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        #header-element { animation-delay: 1.9s; }
        .tool-badge:nth-child(1) { animation-delay: 2.1s; }
        .tool-badge:nth-child(2) { animation-delay: 2.2s; }
        .tool-badge:nth-child(3) { animation-delay: 2.3s; }
        .tool-badge:nth-child(4) { animation-delay: 2.4s; }
        #footer-element { animation-delay: 2.6s; }

        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }
    </style>
</head>

                <path d="M657.833,584.167L657.833,287.083L432.667,722.792L207.5,287.042L207.5,584.167L138.417,584.167L138.417,138.458L207.5,138.458L432.667,574.708L657.833,138.458L726.917,138.458L726.917,584.167L657.833,584.167Z" style="fill:#ff7a00;fill-rule:nonzero;"/>

                <g transform="rotate(120 50 50)"><path class="blade" d="M 50 50 L 110 50 L 110 -10 L 50 -10 Z" /></g>

    <main class="w-full max-w-5xl mx-auto px-6 flex-grow flex flex-col justify-center relative z-10 py-12 md:py-20">

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full">

            <a href="/pianieditoriali" class="tool-badge ui-element relative bg-console border border-accent/30 rounded-xl p-6 flex flex-col items-center justify-center aspect-square text-center transition-all duration-200 active:scale-95 active:bg-accent/10 shadow-[inset_0_0_15px_rgba(255,122,0,0.04),0_10px_30px_rgba(0,0,0,0.4)] overflow-hidden">

    <script>
        // 1. CODICE LOGICA SHADER BACKGROUND (CANVAS)
        (function() {
          const canvas = document.getElementById('shader-nurvdz8xx');
          if (!canvas) return;
          
          const ctx = canvas.getContext('2d');
          let w, h;
          let time = 0;
          
          const speed = 5 * 0.002;
          const isInteractive = true;
          const blendMode = 'overlay';
          
          const blobs = [
            { color: '#ff7a00', x: 0, y: 0, vx: 1, vy: 1, s: 1, t: 0 },
            { color: '#000000', x: 0, y: 0, vx: -1, vy: 1, s: 1, t: 2 },
            { color: '#000000', x: 0, y: 0, vx: -1, vy: -1, s: 1, t: 4 },
            { color: '#ff7a00', x: 0, y: 0, vx: 1, vy: -1, s: 1, t: 6 }
          ];

          let mouse = { x: 0, y: 0 };
          let targetMouse = { x: 0, y: 0 };
          let hasMouse = false;

          function resize() {
            if (!canvas.parentElement) return;
            w = canvas.parentElement.offsetWidth;
            h = canvas.parentElement.offsetHeight;
            canvas.width = 128; 
            canvas.height = 128;
          }

          window.addEventListener('resize', resize);
          resize();
          setTimeout(resize, 0);

          if (isInteractive) {
            canvas.addEventListener('mousemove', (e) => {
               hasMouse = true;
               const rect = canvas.getBoundingClientRect();
               targetMouse.x = (e.clientX - rect.left) / rect.width * canvas.width;
               targetMouse.y = (e.clientY - rect.top) / rect.height * canvas.height;
            });
            canvas.addEventListener('mouseleave', () => { hasMouse = false; });
          }

          function animate() {
            if (!document.getElementById('shader-nurvdz8xx')) return;

            time += speed;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = blendMode;

            if (isInteractive && hasMouse) {
                mouse.x += (targetMouse.x - mouse.x) * 0.05;
                mouse.y += (targetMouse.y - mouse.y) * 0.05;
            }

            blobs.forEach((b) => {
              const movementX = Math.sin(time + b.t) * 0.5 + Math.sin(time * 0.5 + b.t * 2) * 0.5;
              const movementY = Math.cos(time + b.t) * 0.5 + Math.cos(time * 0.6 + b.t * 2) * 0.5;
              
              let x = (canvas.width / 2) + movementX * (canvas.width * 0.3);
              let y = (canvas.height / 2) + movementY * (canvas.height * 0.3);

              if (isInteractive && hasMouse) {
                 const dx = mouse.x - x;
                 const dy = mouse.y - y;
                 const dist = Math.sqrt(dx*dx + dy*dy);
                 const maxDist = canvas.width * 0.6;
                 
                 if (dist < maxDist) {
                    const force = (maxDist - dist) / maxDist;
                    x += dx * force * 0.2;
                    y += dy * force * 0.2;
                 }
              }

              const radius = canvas.width * 0.5; 
              const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
              g.addColorStop(0, b.color);
              g.addColorStop(1, 'rgba(0,0,0,0)');
              
              ctx.fillStyle = g;
              ctx.beginPath();
              ctx.arc(x, y, radius, 0, Math.PI * 2);
              ctx.fill();
            });
            
            requestAnimationFrame(animate);
          }
          animate();
        })();

        // 2. CICLO DI VITA DELLA SPLASH SCREEN (FADEOUT & CLEANUP)
        document.addEventListener('DOMContentLoaded', () => {
            const splash = document.getElementById('splashScreen');
            if (!splash) return;

            setTimeout(() => {
                splash.classList.add('fade-out');
                setTimeout(() => {
                    splash.remove();
                }, 500); 
            }, 2200); 
        });
    </script>
</body>
