<!DOCTYPE html>
<html lang="it" class="h-full bg-black selection:bg-accent selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RAW // Central OS</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RAW">
    
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/teomacauda/cdn-assets/main/RawIcon.png?v=2">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/teomacauda/cdn-assets/main/RawIcon.png?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    colors: { 
                        dark: '#000000', 
                        console: '#080809',
                        accent: '#FF7A00', 
                        accentHover: '#E56D00',
                        graytext: '#636366',
                    }
                }
            }
        }
    </script>

    <style>
        /* --- SHADER DI SFONDO GLOBALE PERMANENTE --- */
        .shader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 0% 0%, #ff7a00, transparent 80%), 
                radial-gradient(circle at 100% 0%, #000000, transparent 80%), 
                radial-gradient(circle at 100% 100%, #000000, transparent 80%), 
                radial-gradient(circle at 0% 100%, #ff7a00, transparent 80%);
        }

        /* --- STILI INTRO SPLASH SCREEN (DISEGNO LOGO) --- */
        .splash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        /* Dimensioni ridotte e centratura assoluta */
        .logo-wrapper {
            width: 320px; /* Ridotto per un look più premium e bilanciato */
            max-width: 60%; /* Ottimizzato per display mobile stretti */
            height: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-path {
            fill: transparent;
            stroke: rgb(255, 122, 0); 
            stroke-width: 3;            
            /* Fallback di sicurezza molto elevato per evitare che la linea si interrompa prima del completamento */
            stroke-dasharray: 8000; 
            stroke-dashoffset: 8000;
            filter: drop-shadow(0 0 8px rgba(255, 122, 0, 0.8));
        }

        .start-animation .logo-path {
            animation: 
                drawLine 3s cubic-bezier(0.4, 0, 0.2, 1) forwards, 
                fillLogo 1.5s ease-in-out 3s forwards;          
        }

        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }

        @keyframes fillLogo {
            0% {
                fill: transparent;
                filter: drop-shadow(0 0 8px rgba(255, 122, 0, 0.8));
            }
            100% {
                fill: rgb(255, 122, 0);
                filter: drop-shadow(0 0 25px rgba(255, 122, 0, 0.6));
                stroke-width: 0;
            }
        }

        .splash-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* --- APPARIZIONE SEQUENZIALE INTERFACCIA HUB --- */
        .ui-element {
            opacity: 0;
            transform: translateY(12px) scale(0.98);
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Transizioni fluide per elementi interni dei badge */
        .tool-badge {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }
        .tool-badge svg,
        .tool-badge h2,
        .tool-badge .rounded-full,
        .tool-badge .absolute {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Animazioni al passaggio del mouse (Solo Desktop con cursore di precisione) */
        @media (hover: hover) and (pointer: fine) {
            .tool-badge:hover {
                border-color: rgba(255, 122, 0, 0.8);
                box-shadow: 
                    inset 0 0 25px rgba(255, 122, 0, 0.15),
                    0 0 35px rgba(255, 122, 0, 0.3),
                    0 15px 35px rgba(0, 0, 0, 0.7);
                transform: translateY(-8px) scale(1.03) !important;
            }
            .tool-badge:hover .rounded-full {
                background-color: rgba(255, 122, 0, 0.2);
                border-color: rgba(255, 122, 0, 0.6);
                box-shadow: 0 0 20px rgba(255, 122, 0, 0.4);
            }
            .tool-badge:hover svg {
                transform: scale(1.15) rotate(3deg);
                filter: drop-shadow(0 0 10px rgba(255, 122, 0, 0.8));
            }
            .tool-badge:hover h2 {
                color: #ff7a00;
                text-shadow: 0 0 12px rgba(255, 122, 0, 0.6);
                letter-spacing: 0.05em;
            }
            .tool-badge:hover .absolute {
                opacity: 0.25;
            }
        }
        
        .ready #header-element { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.0s; }
        .ready .tool-badge:nth-child(1) { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.1s; }
        .ready .tool-badge:nth-child(2) { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.18s; }
        .ready .tool-badge:nth-child(3) { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.26s; }
        .ready .tool-badge:nth-child(4) { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.34s; }
        .ready #footer-element { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.5s; }

        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }
    </style>
</head>
<body class="min-h-screen bg-dark text-white font-sans flex flex-col justify-between overflow-x-hidden select-none antialiased relative">

        <canvas id="shader-nurvdz8xx" style="width: 100%; height: 100%; display: block; filter: blur(100px); opacity: 1; mix-blend-mode: normal;"></canvas>
    </div>

    <div class="splash-overlay" id="splashScreen">
        <div class="logo-wrapper">
            <svg width="100%" height="100%" viewBox="-30 -30 1078 783" version="1.1" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;overflow:visible;">
                <path class="logo-path" d="M1017.46,153.167L1017.42,569.5L865.335,496.583L865.335,722.792L539.502,722.667L575.919,653.667L796.127,653.667L796.127,69.25L616.835,69.25L432.669,425.125L248.502,69.25L69.21,69.25L69.21,653.667L289.502,653.667L325.96,722.792L0.002,722.792L0.002,-0L289.502,-0L432.669,275.375L575.835,-0L865.335,-0L865.335,226.083L1017.46,153.167Z" style="fill-rule:nonzero;"/>
                <path class="logo-path" d="M657.833,584.167L657.833,287.083L432.667,722.792L207.5,287.042L207.5,584.167L138.417,584.167L138.417,138.458L207.5,138.458L432.667,574.708L657.833,138.458L726.917,138.458L726.917,584.167L657.833,584.167Z" style="fill-rule:nonzero;"/>

    </div>

    <main class="w-full max-w-5xl mx-auto px-6 flex-grow flex flex-col justify-center relative z-10 py-12 md:py-20">
        
        <div id="header-element" class="ui-element text-center mb-16 md:mb-24 space-y-1">
            <h1 class="text-xs font-mono font-bold tracking-[0.3em] text-accent uppercase">Central OS</h1>
            <p class="text-4xl md:text-5xl font-extrabold tracking-tighter text-white uppercase">RAW</p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full">
            
            <a href="/consegnavideo" class="tool-badge ui-element relative bg-console/90 border border-accent/30 rounded-xl p-6 flex flex-col items-center justify-center aspect-square text-center transition-all duration-200 active:scale-95 active:bg-accent/10 shadow-[inset_0_0_15px_rgba(255,122,0,0.04),0_10px_30px_rgba(0,0,0,0.4)] overflow-hidden backdrop-blur-sm">
                <div class="absolute inset-0 bg-gradient-to-b from-accent/5 to-transparent"></div>
                <div class="relative z-10 flex flex-col items-center space-y-6">

                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 3h12M6 21h12M4 6h16M4 18h16M10 9l5 3-5 3V9z"></path>
                        </svg>
                    </div>
                    <h2 class="text-sm font-semibold tracking-tight text-white uppercase font-mono">Consegna</h2>
                </div>
            </a>

            <a href="/script" class="tool-badge ui-element relative bg-console/90 border border-accent/30 rounded-xl p-6 flex flex-col items-center justify-center aspect-square text-center transition-all duration-200 active:scale-95 active:bg-accent/10 shadow-[inset_0_0_15px_rgba(255,122,0,0.04),0_10px_30px_rgba(0,0,0,0.4)] overflow-hidden backdrop-blur-sm">
                <div class="absolute inset-0 bg-gradient-to-b from-accent/5 to-transparent"></div>
                <div class="relative z-10 flex flex-col items-center space-y-6">
                    <div class="p-4 rounded-full bg-accent/5 border border-accent/20">
                        <svg class="w-8 h-8 text-accent" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                    </div>
                    <h2 class="text-sm font-semibold tracking-tight text-white uppercase font-mono">Script</h2>
                </div>
            </a>

            <a href="/pianieditoriali" class="tool-badge ui-element relative bg-console/90 border border-accent/30 rounded-xl p-6 flex flex-col items-center justify-center aspect-square text-center transition-all duration-200 active:scale-95 active:bg-accent/10 shadow-[inset_0_0_15px_rgba(255,122,0,0.04),0_10px_30px_rgba(0,0,0,0.4)] overflow-hidden backdrop-blur-sm">
                <div class="absolute inset-0 bg-gradient-to-b from-accent/5 to-transparent"></div>
                <div class="relative z-10 flex flex-col items-center space-y-6">
                    <div class="p-4 rounded-full bg-accent/5 border border-accent/20">
                        <svg class="w-8 h-8 text-accent" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7"></path>
                            <circle cx="18" cy="18" r="2" stroke="currentColor" stroke-width="1.5"></circle>

            <a href="/report" class="tool-badge ui-element relative bg-console/90 border border-accent/30 rounded-xl p-6 flex flex-col items-center justify-center aspect-square text-center transition-all duration-200 active:scale-95 active:bg-accent/10 shadow-[inset_0_0_15px_rgba(255,122,0,0.04),0_10px_30px_rgba(0,0,0,0.4)] overflow-hidden backdrop-blur-sm">
                <div class="absolute inset-0 bg-gradient-to-b from-accent/5 to-transparent"></div>
                <div class="relative z-10 flex flex-col items-center space-y-6">
                    <div class="p-4 rounded-full bg-accent/5 border border-accent/20">
                        <svg class="w-8 h-8 text-accent" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>

        </div>
    </main>

    <footer id="footer-element" class="ui-element py-6 text-center text-[9px] font-mono text-graytext/40 tracking-[0.2em] uppercase relative z-10">
        Privileged Access // &copy; <script>document.write(new Date().getFullYear())</script> // Teo Macauda
    </footer>

    <script>
        // 1. MOTORE SHADER CANVAS LISCIO
        (function() {
          const canvas = document.getElementById('shader-nurvdz8xx');
          if (!canvas) return;
          
          const ctx = canvas.getContext('2d');
          let w, h;
          let time = 0;
          
          const speed = 5 * 0.002;
          const isInteractive = true;
          const blendMode = 'overlay';
          
          const blobs = [
            { color: '#ff7a00', x: 0, y: 0, vx: 1, vy: 1, s: 1, t: 0 },
            { color: '#000000', x: 0, y: 0, vx: -1, vy: 1, s: 1, t: 2 },
            { color: '#000000', x: 0, y: 0, vx: -1, vy: -1, s: 1, t: 4 },
            { color: '#ff7a00', x: 0, y: 0, vx: 1, vy: -1, s: 1, t: 6 }
          ];

          let mouse = { x: 0, y: 0 };
          let targetMouse = { x: 0, y: 0 };
          let hasMouse = false;

          function resize() {
            if (!canvas.parentElement) return;
            w = canvas.parentElement.offsetWidth;
            h = canvas.parentElement.offsetHeight;
            canvas.width = 128; 
            canvas.height = 128;
          }

          window.addEventListener('resize', resize);
          resize();
          setTimeout(resize, 0);

          if (isInteractive) {
            canvas.addEventListener('mousemove', (e) => {
               hasMouse = true;
               const rect = canvas.getBoundingClientRect();
               targetMouse.x = (e.clientX - rect.left) / rect.width * canvas.width;
               targetMouse.y = (e.clientY - rect.top) / rect.height * canvas.height;
            });
            canvas.addEventListener('mouseleave', () => { hasMouse = false; });
          }

          function animate() {
            if (!document.getElementById('shader-nurvdz8xx')) return;

            time += speed;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = blendMode;

            if (isInteractive && hasMouse) {
                mouse.x += (targetMouse.x - mouse.x) * 0.05;
                mouse.y += (targetMouse.y - mouse.y) * 0.05;
            }

            blobs.forEach((b) => {
              const movementX = Math.sin(time + b.t) * 0.5 + Math.sin(time * 0.5 + b.t * 2) * 0.5;
              const movementY = Math.cos(time + b.t) * 0.5 + Math.cos(time * 0.6 + b.t * 2) * 0.5;
              
              let x = (canvas.width / 2) + movementX * (canvas.width * 0.3);
              let y = (canvas.height / 2) + movementY * (canvas.height * 0.3);

              if (isInteractive && hasMouse) {
                 const dx = mouse.x - x;
                 const dy = mouse.y - y;
                 const dist = Math.sqrt(dx*dx + dy*dy);
                 const maxDist = canvas.width * 0.6;
                 
                 if (dist < maxDist) {
                    const force = (maxDist - dist) / maxDist;
                    x += dx * force * 0.2;
                    y += dy * force * 0.2;
                 }
              }

              const radius = canvas.width * 0.5; 
              const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
              g.addColorStop(0, b.color);
              g.addColorStop(1, 'rgba(0,0,0,0)');
              
              ctx.fillStyle = g;
              ctx.beginPath();
              ctx.arc(x, y, radius, 0, Math.PI * 2);
              ctx.fill();
            });
            
            requestAnimationFrame(animate);
          }
          animate();
        })();

        // 2. GESTIONE SINCRONIZZAZIONE SEQUENZIALE PERFETTA
        document.addEventListener('DOMContentLoaded', () => {
            const splash = document.getElementById('splashScreen');
            if (!splash) return;

            // Inizializza dinamicamente la lunghezza dei path del logo per compatibilità cross-device totale
            const paths = document.querySelectorAll('.logo-path');
            paths.forEach(path => {
                const length = Math.ceil(path.getTotalLength()) + 20; // Abbondante margine di sicurezza per evitare outline incomplete
                path.style.strokeDasharray = length;
                path.style.strokeDashoffset = length;
            });
            
            // Forza il ricalcolo del layout prima di avviare l'animazione per evitare flash di rendering
            void splash.offsetWidth;
            
            // Avvia l'animazione di disegno
            splash.classList.add('start-animation');

            setTimeout(() => {
                splash.classList.add('fade-out'); 
                
                setTimeout(() => {
                    splash.remove();
                    document.body.classList.add('ready');
                }, 400); 
            }, 4500); 
        });
    </script>
</body>
</html>
