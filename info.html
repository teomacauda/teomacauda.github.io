<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Teo | Videomaker & Content Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ff7a00;
            --bg-dark: #050505;
            --card-bg: rgba(15, 15, 15, 0.9);
        }

        /* Utilizziamo dvh (dynamic viewport height) per gestire correttamente le barre dei browser mobile */
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            min-height: 100dvh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px 16px; /* Padding per evitare che tocchi i bordi su schermi piccoli */
            overflow-x: hidden;
            overflow-y: auto;
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 122, 0, 0.1);
            border-radius: 32px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
        }

        .btn-premium {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-accent {
            background: var(--accent);
            color: #000;
            font-weight: 800;
            transition: all 0.3s ease;
        }

        .btn-accent:active {
            transform: scale(0.96);
            filter: brightness(1.1);
        }

        .btn-premium:active {
            transform: scale(0.96);
            background: rgba(255, 122, 0, 0.05);
            border-color: rgba(255, 122, 0, 0.3);
        }

        .shimmer {
            position: relative;
            overflow: hidden;
        }

        .shimmer::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0) 40%,
                rgba(255, 255, 255, 0.25) 50%,
                rgba(255, 255, 255, 0) 60%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(45deg);
            animation: shimmer 4s infinite linear;
        }

        @keyframes shimmer {
            0% { transform: translateX(-130%) rotate(45deg); }
            100% { transform: translateX(130%) rotate(45deg); }
        }

        .fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(2deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: var(--accent);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .orange-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: var(--accent);
            filter: blur(120px);
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
        }

        .logo-container {
            width: 112px;
            height: 112px;
            animation: float 4s ease-in-out infinite;
        }
        
        .logo-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 24px;
        }

        /* Modificato per essere relativo al container se lo spazio è poco */
        .brand-logo-top-left {
            height: 32px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(255, 122, 0, 0.3));
        }
    </style>
</head>
<body>

    </main>

</body>
