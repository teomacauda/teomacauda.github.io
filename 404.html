<style>
/* Pagina 404: autonoma (non dipende dagli altri file), perché viene mostrata a qualsiasi indirizzo sbagliato.
   Stile del sito: nero, arancio #DA5512, vetro, pillole, tabellone a lamelle. */
:root { --arancio: #DA5512; --arancio-chiaro: #F2874F; --vetro: rgba(255,255,255,.07); --bordo: rgba(255,255,255,.16); }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #000; color: #fff; font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.pagina { position: relative; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 96px 20px 56px; text-align: center; isolation: isolate; overflow: hidden; }
.pagina::before { content: ""; position: absolute; z-index: -1; left: 50%; top: 42%; width: min(900px, 120vw); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(218,85,18,.45), rgba(218,85,18,.08) 45%, rgba(218,85,18,0) 70%); }
.logo { position: absolute; left: clamp(18px, 4vw, 48px); top: 22px; width: 52px; display: block; color: var(--arancio); }
.logo svg { display: block; width: 100%; height: auto; }
.eyebrow { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: .74rem; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.6); }
.tabellone { display: flex; gap: clamp(8px, 2vw, 16px); perspective: 900px; }
.cella { position: relative; width: clamp(78px, 22vw, 168px); height: clamp(112px, 31vw, 240px); font-family: "Bebas Neue", Impact, "Arial Narrow", sans-serif; font-size: clamp(110px, 31vw, 240px); line-height: clamp(112px, 31vw, 240px); }
.cella .m { position: absolute; left: 0; right: 0; height: 50%; overflow: hidden; background: #151515; border: 1px solid rgba(255,255,255,.1); }
.cella .m b { position: absolute; left: 0; right: 0; height: 200%; text-align: center; font-weight: 400; }
.cella .su { top: 0; border-radius: 14px 14px 0 0; border-bottom: 1px solid #000; }
.cella .su b { top: 0; }
.cella .giu { bottom: 0; border-radius: 0 0 14px 14px; }
.cella .giu b { bottom: 0; }
.cella.ar .m { color: var(--arancio-chiaro); }
.cella .lam1 { top: 0; transform-origin: 50% 100%; border-radius: 14px 14px 0 0; border-bottom: 1px solid #000; z-index: 3; -webkit-backface-visibility: hidden; backface-visibility: hidden; animation: cade .5s cubic-bezier(.5,0,.8,.4) forwards; animation-delay: var(--d, 0s); }
.cella .lam1 b { top: 0; }
.cella .lam2 { bottom: 0; transform-origin: 50% 0; border-radius: 0 0 14px 14px; z-index: 3; -webkit-backface-visibility: hidden; backface-visibility: hidden; transform: rotateX(90deg); animation: arriva .5s cubic-bezier(.2,1.4,.5,1) forwards; animation-delay: calc(var(--d, 0s) + .5s); }
.cella .lam2 b { bottom: 0; }
.cella .vecchio { color: transparent; }
/* le cifre in basso restano invisibili finché la lamella non è caduta: prima non si deve leggere nulla */
.cella .giu:not(.lam2) b { opacity: 0; }
@keyframes cade { to { transform: rotateX(-90deg); } }
@keyframes arriva { to { transform: rotateX(0deg); } }
.cella .lam1 { background: #151515; }
.titolo { margin: 0; font-size: clamp(1.9rem, 5.4vw, 3.6rem); font-weight: 700; letter-spacing: -.035em; line-height: 1.02; text-transform: uppercase; text-wrap: balance; }
.titolo em { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; text-transform: none; color: var(--arancio); font-size: 1.12em; letter-spacing: -.01em; }
.testo { margin: 0; max-width: 44ch; color: rgba(255,255,255,.75); font-size: clamp(1rem, 1.6vw, 1.15rem); text-wrap: pretty; }
.azioni { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 6px; }
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: .6em; padding: 1rem 1.9rem; border-radius: 999px; border: 1px solid transparent; font: 600 1rem "Instrument Sans", Arial, sans-serif; line-height: 1; transition: transform .4s cubic-bezier(.23,1,.32,1), background-color .3s, border-color .3s; }
.btn::after { content: ""; position: absolute; inset: 0; right: auto; width: 100%; left: -100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent); transition: left .5s; pointer-events: none; }
.btn:hover { transform: translateY(-1px); }
.btn:hover::after, .btn:focus-visible::after { left: 100%; }
.btn:active { transform: scale(.97); }
.btn-primario { background: var(--arancio); color: #000; }
.btn-primario::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent); }
.btn-primario:hover { background: #F0651D; }
.btn-vetro { background: var(--vetro); border-color: var(--bordo); color: #fff; -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
.btn-vetro:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.28); }
.btn svg { width: 1.1em; height: 1.1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.piede { position: absolute; left: 0; right: 0; bottom: 18px; font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.4); }
@media (prefers-reduced-motion: reduce) { .cella .giu:not(.lam2) b { opacity: 1; } .cella .lam1, .cella .lam2 { animation: none; display: none; } .btn, .btn::after { transition: none; } }
