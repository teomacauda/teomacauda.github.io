<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teo | Videomaker & Content Marketing</title>
    <!-- 
      OTTIMIZZAZIONE TECNICA:
      1. Rimosso Tailwind CDN (risparmiati ~400kb di JS).
      2. Rimosso Google Fonts (caricamento istantaneo tramite font di sistema).
      3. CSS critico inline per zero latenza di rete.
      4. Animazioni ottimizzate per la GPU.
    -->
    <style>
        :root {
            --accent: #ff7a00;
            --bg-dark: #050505;
            --card-bg: rgba(15, 15, 15, 0.85);
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-stack);
            background: var(--bg-dark);
            color: #fff;
            margin: 0;
            padding: 20px 16px;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Bagliori di sfondo - ottimizzati */
        .orange-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: var(--accent);
            filter: blur(120px);
            opacity: 0.06;
            z-index: -1;
            pointer-events: none;
            will-change: transform;
        }
        .top-left { top: -100px; left: -100px; }
        .bottom-right { bottom: -100px; right: -100px; }

        /* Container principale */
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 122, 0, 0.15);
            border-radius: 32px;
            width: 100%;
            max-width: 380px;
            padding: 32px 24px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Logo in alto a sinistra - Dimensioni aumentate */
        .brand-logo-top {
            position: absolute;
            top: 24px;
            left: 24px;
            height: 40px; /* Aumentato da 28px */
            width: auto;
            opacity: 1;
            filter: drop-shadow(0 0 10px rgba(255, 122, 0, 0.2));
        }

        /* Foto Profilo e Animazione Float */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px; /* Aumentato leggermente per dare spazio al logo più grande */
            margin-bottom: 32px;
        }

        .avatar-container {
            width: 110px;
            height: 110px;
            border-radius: 28px;
            padding: 6px;
            background: linear-gradient(135deg, #222, #000);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            animation: float 4s ease-in-out infinite;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 22px;
        }

        /* Tipografia */
        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            letter-spacing: -0.02em;
        }

        .sub-badge {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            color: rgba(255,255,255,0.4);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot-sep { width: 4px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 50%; }

        .status-pill {
            margin-top: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite;
        }

        .quote {
            text-align: center;
            margin-bottom: 32px;
            padding: 0 10px;
        }

        .quote p {
            font-size: 13px;
            line-height: 1.5;
            color: #ccc;
            font-style: italic;
        }

        .quote b { color: #fff; font-weight: 600; font-style: normal; }

        /* Pulsanti */
        .btn-stack { display: flex; flex-direction: column; gap: 12px; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: transform 0.2s, filter 0.2s;
        }

        .btn:active { transform: scale(0.97); }

        .btn-main {
            background: var(--accent);
            color: #000;
            box-shadow: 0 10px 20px -5px rgba(255, 122, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--accent);
            flex: 1;
        }

        .grid-half { display: flex; gap: 12px; }

        /* Effetto Shimmer */
        .shimmer::after {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite linear;
        }

        /* Footer */
        footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .footer-info { margin-bottom: 16px; }
        .footer-info p { margin: 2px 0; font-weight: 600; text-transform: uppercase; }
        .piva { font-size: 8px; color: rgba(255,255,255,0.2); }
        .name { font-size: 9px; color: rgba(255,255,255,0.5); letter-spacing: 0.1em; }
        .addr { font-size: 7px; color: rgba(255,255,255,0.1); }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.2);
        }

        /* Animazioni ottimizzate */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(1deg); }
            50% { transform: translateY(-6px) rotate(-1deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shimmer {
            0% { transform: translateX(-150%) rotate(45deg); }
            100% { transform: translateX(150%) rotate(45deg); }
        }

        svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="orange-glow top-left"></div>

        <footer>
            <div class="footer-info">

        </footer>
    </main>

</body>
</html>
